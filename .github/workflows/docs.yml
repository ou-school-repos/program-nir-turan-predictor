---
name: docs

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            exiftool \
            pandoc \
            qpdf \
            python3-pip \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-lang-english \
            texlive-xetex
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt matplotlib networkx pillow

      - name: Build paper figures
        run: |
          mkdir -p docs/out
          python3 scripts/plot_18.py
          python3 scripts/plot_76.py --pdf
          python3 scripts/plot_anomaly.py

      - name: Build paper and markdown PDFs
        run: make docs paper

      - name: Compute PDF bundle name
        run: |
          short_sha="${GITHUB_SHA::7}"
          date_iso_built="$(date -u +%F)"
          echo "PDF_BUNDLE_DIR=all-pdfs_${short_sha}_${date_iso_built}" >> "$GITHUB_ENV"

      - name: Stage PDFs for upload
        run: |
          mkdir -p "$PDF_BUNDLE_DIR"
          mapfile -t pdfs < <(find . -type f -name '*.pdf' \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './.lake/*' \
            -not -path './.tmp/*' \
            -not -path "./$PDF_BUNDLE_DIR/*" \
            | sort)
          for pdf in "${pdfs[@]}"; do
            rel=${pdf#./}
            mkdir -p "$PDF_BUNDLE_DIR/$(dirname "$rel")"
            cp "$pdf" "$PDF_BUNDLE_DIR/$rel"
          done

      - name: Upload all-pdfs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PDF_BUNDLE_DIR }}
          path: ${{ env.PDF_BUNDLE_DIR }}
          if-no-files-found: error
